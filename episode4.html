<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>第4話 雪に消えた記憶</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <header class="header">
    <h1>第4話 雪に消えた記憶</h1>
    <p class="subtitle">新潟市 古町・地下オークション会場</p>
  </header>

  <div class="game-layout">
    <section class="stage">
      <div id="text" class="narration"></div>
      <div id="sceneImage"></div>
      <div id="choices" class="choices"></div>
    </section>

    <aside class="sidebar">
      <div class="yui">
        <h3>雪村ユイ</h3>
        <p id="yuiText">彼、相当うなされているわね。何か大切なものを守ろうとしているみたい。</p>
      </div>
      <h3>集めた情報</h3>
      <div id="evidence" class="evidence"></div>
      <div id="conclusionArea" class="conclusion-area">
        <button id="conclusionBtn">結論を出す</button>
      </div>
    </aside>
  </div>
  <footer class="footer">新潟県警 事件ファイル</footer>
</div>

<script type="module" src="episode4.js"></script>
</body>
</html>
