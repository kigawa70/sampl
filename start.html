<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン - 消えたアーカイブ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-form { max-width: 400px; margin: 50px auto; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 12px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: none; color: #000; }
    .auth-buttons { display: flex; gap: 10px; }
    button { cursor: pointer; padding: 10px; flex: 1; border-radius: 8px; border: none; font-weight: bold; }
    #loginBtn { background: #38bdf8; color: #fff; }
    #registerBtn { background: #34d399; color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="auth-form">
      <h2>調査員ログイン</h2>
      <input type="text" id="email" placeholder="ユーザーID (またはメールアドレス)">
      <input type="password" id="password" placeholder="パスワード (半角英数字)">
      <div class="auth-buttons">
        <button id="loginBtn">ログイン</button>
        <button id="registerBtn">新規登録</button>
      </div>
      <p id="message" style="color: #fb7185; margin-top: 15px; font-size: 0.9rem; min-height: 1.2em;"></p>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    // Firebaseコンソールで取得した設定値をここに入れる
const firebaseConfig = {
    apiKey: "AIzaSyAjSxFPJ0Ym8u4B0t1n8BQ52wFrfg8l-r8",
    authDomain: "niigata-game.firebaseapp.com",
    projectId: "niigata-game",
    storageBucket: "niigata-game.firebasestorage.app",
    messagingSenderId: "256281746306",
    appId: "1:256281746306:web:bb3823e7e8f7f769870d9b",
    measurementId: "G-JKCRVL23K0"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');
    const msgEl = document.getElementById('message');

    // パスワードバリデーション（半角英数字のみ）
    const validatePass = (pass) => /^[a-zA-Z0-9]+$/.test(pass);

    // 入力チェック用関数
    const validateInput = () => {
      msgEl.textContent = ""; // メッセージをクリア
      if (!emailEl.value || !passEl.value) {
        msgEl.textContent = "IDとパスワードを入力してください";
        return false;
      }
      if (!validatePass(passEl.value)) {
        msgEl.textContent = "パスワードは半角英数字のみです";
        return false;
      }
      return true;
    };

    // IDをメール形式に補完する関数
    const getFormattedEmail = (val) => {
      return val.includes('@') ? val : `${val}@game.com`;
    };

    // 新規登録
    document.getElementById('registerBtn').onclick = async () => {
      if (!validateInput()) return;

      const email = getFormattedEmail(emailEl.value);
      try {
        await createUserWithEmailAndPassword(auth, email, passEl.value);
        location.href = 'index.html';
      } catch (e) {
        if (e.code === 'auth/email-already-in-use') {
          msgEl.textContent = "このIDは既に使用されています";
        } else {
          msgEl.textContent = "登録エラー: " + e.message;
        }
      }
    };

    // ログイン
    document.getElementById('loginBtn').onclick = async () => {
      if (!validateInput()) return;

      const email = getFormattedEmail(emailEl.value);
      try {
        // Firebaseの認証が終わるまで待機
        await signInWithEmailAndPassword(auth, email, passEl.value);
        // 成功した場合のみ移動
        location.href = 'index.html';
      } catch (e) {
        // 失敗した場合はここで止まり、エラーを表示
        msgEl.textContent = "IDまたはパスワードが正しくありません";
        console.error("Login Error:", e.code);
      }
    };
  </script>
</body>
</html>
