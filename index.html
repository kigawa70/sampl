<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン - 消えたアーカイブ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-form { max-width: 400px; margin: 50px auto; padding: 30px; background: rgba(255,255,255,0.1); border-radius: 12px; text-align: center; }
    .input-group { display: none; margin-top: 20px; text-align: left; }
    input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: none; color: #000; box-sizing: border-box; }
    .auth-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
    button { cursor: pointer; padding: 12px; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; transition: 0.3s; }
    
    /* ボタン色 */
    .primary-btn { background: #38bdf8; color: #fff; width: 100%; }
    .secondary-btn { background: #34d399; color: #fff; width: 100%; }
    .back-btn { background: transparent; color: #94a3b8; border: 1px solid #94a3b8; margin-top: 10px; font-size: 0.8rem; }
    
    .msg { color: #fb7185; font-size: 0.9rem; margin-top: 10px; min-height: 1.2em; }
    .hint { color: #94a3b8; font-size: 0.8rem; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="auth-form">
      <h2 id="formTitle">調査員システム</h2>
      
      <div id="initialButtons" class="auth-buttons">
        <button id="showLoginBtn" class="primary-btn">ログイン</button>
        <button id="showRegisterBtn" class="secondary-btn">新規登録</button>
      </div>

      <div id="inputForm" class="input-group">
        <label for="email">ユーザーID</label>
        <input type="text" id="email" placeholder="ID名を入力">
        
        <label for="password">パスワード</label>
        <p id="passHint" class="hint" style="display:none;">※6文字以上の半角英数字</p>
        <input type="password" id="password" placeholder="パスワードを入力">
        
        <button id="submitBtn" class="primary-btn">進む</button>
        <button id="backToTop" class="back-btn">戻る</button>
      </div>

      <div id="message" class="msg"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAjSxFPJ0Ym8u4B0t1n8BQ52wFrfg8l-r8",
      authDomain: "niigata-game.firebaseapp.com",
      projectId: "niigata-game",
      storageBucket: "niigata-game.firebasestorage.app",
      messagingSenderId: "256281746306",
      appId: "1:256281746306:web:bb3823e7e8f7f769870d9b",
      measurementId: "G-JKCRVL23K0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const initialButtons = document.getElementById('initialButtons');
    const inputForm = document.getElementById('inputForm');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const passHint = document.getElementById('passHint');
    const msgEl = document.getElementById('message');
    
    const emailEl = document.getElementById('email');
    const passEl = document.getElementById('password');

    let mode = 'login'; // 'login' or 'register'

    // 表示切り替え関数
    function showForm(targetMode) {
      mode = targetMode;
      initialButtons.style.display = 'none';
      inputForm.style.display = 'block';
      msgEl.textContent = "";

      if (mode === 'login') {
        formTitle.textContent = "ログイン";
        submitBtn.textContent = "ログインする";
        submitBtn.className = "primary-btn";
        passHint.style.display = 'none';
      } else {
        formTitle.textContent = "新規登録";
        submitBtn.textContent = "登録する";
        submitBtn.className = "secondary-btn";
        passHint.style.display = 'block';
      }
    }

    // 戻るボタン
    document.getElementById('backToTop').onclick = () => {
      initialButtons.style.display = 'flex';
      inputForm.style.display = 'none';
      formTitle.textContent = "調査員システム";
    };

    document.getElementById('showLoginBtn').onclick = () => showForm('login');
    document.getElementById('showRegisterBtn').onclick = () => showForm('register');

    // IDをメール形式に補完 (@game.comを自動付与)
    const getFormattedEmail = (val) => val.includes('@') ? val : `${val}@game.com`;

    // 実行ボタン
    submitBtn.onclick = async () => {
      const email = getFormattedEmail(emailEl.value);
      const password = passEl.value;

      if (!emailEl.value || !password) {
        msgEl.textContent = "IDとパスワードを入力してください";
        return;
      }

      if (mode === 'register' && password.length < 6) {
        msgEl.textContent = "パスワードは6文字以上にしてください";
        return;
      }

      try {
        if (mode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        location.href = 'select.html';
      } catch (e) {
        console.error(e);
        if (e.code === 'auth/user-not-found' || e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
          msgEl.textContent = "IDまたはパスワードが正しくありません";
        } else if (e.code === 'auth/email-already-in-use') {
          msgEl.textContent = "このIDは既に使用されています";
        } else if (e.code === 'auth/weak-password') {
          msgEl.textContent = "パスワードが短すぎます(6文字以上必要)";
        } else {
          msgEl.textContent = "エラーが発生しました";
        }
      }
    };
  </script>
</body>
</html>
