<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>新潟ミステリ 第1話「白砂のネックレス」</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game">
    <header class="header">
      <h1>第1話「白砂のネックレス」</h1>
      <p class="subtitle">舞台：関屋浜近くの民宿</p>
    </header>

    <main class="main">
      <section class="stage">
        <div id="narration" class="narration">読み込み中…</div>
        <div id="choices" class="choices"></div>
      </section>

      <aside class="sidebar">
        <h2>手がかり</h2>
        <ul id="clueList">
          <li>部屋は施錠されていた</li>
          <li>床に白砂が付着</li>
          <li>窓に足跡なし</li>
          <li>オーナーの証言の矛盾</li>
          <li>海風の向き</li>
        </ul>

        <h2>捜査ログ</h2>
        <div id="log" class="log"></div>
      </aside>
    </main>

    <footer class="footer">
      <button id="observeBtn">観察</button>
      <button id="talkBtn">聞き取り</button>
      <button id="deduceBtn">推理</button>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
