<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>消えたアーカイブ ― 新潟</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>消えたアーカイブ</h1>
      <div class="subtitle">― 新潟に眠る真実 ―</div>
    </header>

    <section class="stage">
      <div class="narration">
        舞台は現代の新潟市。<br>
        海、川、山、雪——多様な風景の裏で、<br>
        人知れず消えた「調査資料（アーカイブ）」が存在する。<br><br>
        あなたは新潟県警の新人アナリスト。
      </div>
    </section>

    <section class="stage">
      <h2 style="margin-top:0;">話数選択</h2>
      <div class="choices episode-list">
        <button class="episode-btn" data-ep="1">第1話 白砂のネックレス</button>
        <button class="episode-btn locked" data-ep="2" disabled>第2話 夜の校舎は雪を隠す</button>
        <button class="episode-btn locked" data-ep="3" disabled>第3話 闇市クロニクル</button>
        <button class="episode-btn locked" data-ep="4" disabled>第4話 雪に消えた記憶</button>
        <button class="episode-btn locked" data-ep="5" disabled>最終話 真実は雪線の果てに</button>
      </div>
    </section>

    <footer class="footer">
      新潟県警・非公式調査記録
    </footer>
  </div>

  <script type="module">
    // Firebase SDK の読み込み
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    // TODO: ご自身の Firebase 設定を貼り付けてください
const firebaseConfig = {
    apiKey: "AIzaSyAjSxFPJ0Ym8u4B0t1n8BQ52wFrfg8l-r8",
    authDomain: "niigata-game.firebaseapp.com",
    projectId: "niigata-game",
    storageBucket: "niigata-game.firebasestorage.app",
    messagingSenderId: "256281746306",
    appId: "1:256281746306:web:bb3823e7e8f7f769870d9b",
    measurementId: "G-JKCRVL23K0"
  };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ログイン状態を監視し、データを取得したらボタンを有効化する
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        // ログインしていない場合はログイン画面（index.html）へ
        location.href = 'index.html';
        return;
      }

      console.log("ログイン中:", user.email);

      // Firestore から進捗を取得
      let unlockedLevel = 1;
      try {
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          unlockedLevel = docSnap.data().unlockedEpisodes || 1;
        }
      } catch (e) {
        console.error("進捗取得エラー:", e);
      }

      // 全てのボタンに対して状態を更新
      const buttons = document.querySelectorAll('.episode-btn');
      buttons.forEach(btn => {
        const ep = Number(btn.dataset.ep);
        const title = btn.textContent.trim();

        if (ep <= unlockedLevel) {
          // ロック解除
          btn.disabled = false;
          btn.classList.remove('locked');
          
          // イベントリスナーを確実に登録
          btn.onclick = () => {
            if (confirm(`【${title}】を開始します。よろしいですか？`)) {
              location.href = `episode${ep}.html`;
            }
          };
        } else {
          // ロック継続
          btn.disabled = true;
          btn.classList.add('locked');
          btn.onclick = null;
        }
      });
    });
  </script>
</body>
</html>
