<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>消えたアーカイブ ― 新潟</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>消えたアーカイブ</h1>
      <div class="subtitle">― 新潟に眠る真実 ―</div>
    </header>

    <section class="stage">
      <div class="narration">
        舞台は現代の新潟市。<br>
        海、川、山、雪——多様な風景の裏で、<br>
        人知れず消えた「調査資料（アーカイブ）」が存在する。<br><br>
        あなたは新潟県警の新人アナリスト。
      </div>
    </section>

    <section class="stage">
      <h2 style="margin-top:0;">話数選択</h2>
      <div class="choices episode-list">
        <button class="episode-btn" data-ep="1">第1話 白砂のネックレス</button>
        <button class="episode-btn locked" data-ep="2" disabled>第2話 夜の校舎は雪を隠す</button>
        <button class="episode-btn locked" data-ep="3" disabled>第3話 闇市クロニクル</button>
        <button class="episode-btn locked" data-ep="4" disabled>第4話 雪に消えた記憶</button>
        <button class="episode-btn locked" data-ep="5" disabled>最終話 真実は雪線の果てに</button>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

    const firebaseConfig = { /* あなたの設定を入れる */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ログイン状態と進捗の確認
    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = 'index.html'; // 未ログインならログイン画面へ
        return;
      }

      // Firestoreからデータを取得
      const docRef = doc(db, "users", user.uid);
      const docSnap = await getDoc(docRef);
      let unlockedLevel = 1;

      if (docSnap.exists()) {
        unlockedLevel = docSnap.data().unlockedEpisodes || 1;
      }

      // ボタンの更新
      document.querySelectorAll('.episode-btn').forEach(btn => {
        const ep = Number(btn.dataset.ep);
        if (ep <= unlockedLevel) {
          btn.disabled = false;
          btn.classList.remove('locked');
          btn.onclick = () => {
            if (confirm(`第${ep}話を開始しますか？`)) {
              location.href = `episode${ep}.html`;
            }
          };
        }
      });
    });
  </script>
</body>
</html>
