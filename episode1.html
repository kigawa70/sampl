<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>第1話 白砂のネックレス</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <header class="header">
    <h1>第1話 白砂のネックレス</h1>
    <p class="subtitle">新潟市・関屋浜</p>
  </header>

  <div class="game-layout">
    <!-- メイン -->
    <section class="stage">
      <div id="text" class="narration"></div>

      <div id="sceneImage"></div>

      <div id="choices" class="choices"></div>
    </section>

    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="yui">
        <h3>雪村ユイ</h3>
        <p id="yuiText">現場に向こうか。</p>
      </div>

      <h3>集めた情報</h3>
      <div id="evidence" class="evidence"></div>

      <div id="conclusionArea" class="conclusion-area">
        <button id="conclusionBtn">結論を出す</button>
      </div>
    </aside>
  </div>

  <footer class="footer">
    新潟県警 事件ファイル
  </footer>
</div>

<script src="script.js"></script>
</body>
</html>
