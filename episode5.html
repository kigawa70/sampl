<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>最終話 真実は雪線の果てに</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <header class="header">
    <h1>最終話 真実は雪線の果てに</h1>
    <p class="subtitle">信濃川河口・旧港湾倉庫 〜 弥彦山頂</p>
  </header>

  <div class="game-layout">
    <section class="stage">
      <div id="text" class="narration"></div>
      <div id="sceneImage"></div>
      <div id="choices" class="choices"></div>
    </section>

    <aside class="sidebar">
      <div class="yui">
        <h3>雪村ユイ</h3>
        <p id="yuiText">ここが最後よ。気を引き締めていきましょう！</p>
      </div>
      <h3>集めた情報</h3>
      <div id="evidence" class="evidence"></div>
      <div id="conclusionArea" class="conclusion-area">
        <button id="conclusionBtn">結論を出す</button>
      </div>
    </aside>
  </div>
  <footer class="footer">新潟県警 事件ファイル</footer>
</div>

<script type="module" src="episode5.js"></script>

</html>
